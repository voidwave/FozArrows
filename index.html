<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#efe7da">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Spin the cube and free every arrow. A relaxing, addictive 3D puzzle.">
<title>Foz Arrows</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #efe7da; --bg2: #e6dccb; --panel: #f7efe4; --panel-edge: #e2d3c0;
    --ink: #3a2620; --muted: #8d7a6e; --heart: #e5484d; --heart-off: #bca79b;
    --accent: #f0b429; --blue: #3e8bff; --good: #46c37b;
  }
  :root[data-theme="dark"] {
    --bg: #1d1b23; --bg2: #16141b; --panel: #2a2731; --panel-edge: #3a3642;
    --ink: #f3ebdf; --muted: #a79ea9; --heart-off: #57505e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 80% at 50% 45%, var(--bg) 0%, var(--bg2) 100%);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
    transition: background .4s;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  svg { display: block; }

  #stage { position: fixed; inset: 0; }
  #stage canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #stage.shake { animation: shake .35s; }
  @keyframes shake { 20% { transform: translateX(-9px) } 40% { transform: translateX(8px) } 60% { transform: translateX(-5px) } 80% { transform: translateX(3px) } }

  /* ---------- top bar */
  #top {
    position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 10px);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 22px;
    padding: 10px 14px; box-shadow: 0 6px 20px rgba(60,40,20,.08); pointer-events: none;
  }
  #top > * { pointer-events: auto; }
  #level { font-weight: 800; font-size: clamp(18px, 5.2vw, 26px); letter-spacing: -.02em; white-space: nowrap; }
  #hearts { display: flex; gap: 4px; }
  #hearts svg { width: clamp(26px, 7.5vw, 36px); height: auto; fill: var(--heart); transition: fill .3s; }
  #hearts svg.lost { fill: var(--heart-off); }
  #hearts svg.pop { animation: heartPop .5s; }
  @keyframes heartPop { 30% { transform: scale(1.5) rotate(-12deg) } 100% { transform: scale(1) } }
  .icons { display: flex; gap: 10px; justify-self: end; }
  .icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn svg { width: 28px; height: 28px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  #leftPill {
    position: fixed; top: calc(env(safe-area-inset-top) + 72px); left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--panel-edge); border-top: 0; border-radius: 0 0 18px 18px;
    padding: 6px 18px 8px; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px;
    min-width: 120px; flex-direction: column;
  }
  #leftPill .row { display: flex; align-items: center; gap: 8px; }
  #leftPill svg { width: 22px; height: 22px; stroke: var(--blue); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .bar { width: 100%; height: 4px; background: var(--panel-edge); border-radius: 4px; overflow: hidden; }
  #progress { height: 100%; width: 0; background: var(--blue); border-radius: 4px; transition: width .3s; }

  .bump { animation: bump .3s; }
  #leftPill.bump { animation: bumpC .3s; }
  @keyframes bump { 40% { transform: scale(1.18) } }
  @keyframes bumpC { 40% { transform: translateX(-50%) scale(1.12) } }

  #scorePill {
    position: fixed; left: 14px; top: calc(env(safe-area-inset-top) + 130px);
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 999px;
    padding: 6px 16px 6px 10px; display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px;
  }
  #scorePill svg { width: 24px; height: 24px; }
  #comboBadge {
    position: fixed; left: 18px; top: calc(env(safe-area-inset-top) + 178px);
    font-weight: 900; font-size: 22px; color: var(--accent); opacity: 0; transition: opacity .3s;
    text-shadow: 0 2px 0 rgba(0,0,0,.08);
  }
  #comboBadge.show { opacity: 1; }

  #hintBtn { position: fixed; right: 16px; top: calc(env(safe-area-inset-top) + 124px); width: 64px; height: 64px; display: grid; place-items: center;
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 50%; }
  #hintBtn svg { width: 36px; height: 36px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #hintBtn .glow { fill: var(--accent); stroke: none; opacity: .9; }
  #hintBtn.empty .glow { opacity: 0; }
  #hintCount { position: absolute; top: -4px; right: -6px; background: var(--good); color: #fff; font-weight: 800; font-size: 14px;
    min-width: 24px; height: 24px; border-radius: 12px; display: grid; place-items: center; padding: 0 6px; border: 2px solid var(--panel); }
  #hintBtn.empty #hintCount { background: var(--heart-off); }

  #viewBtn { position: fixed; left: 16px; bottom: calc(env(safe-area-inset-bottom) + 18px); width: 64px; height: 64px; border-radius: 50%;
    background: var(--panel); border: 1px solid var(--panel-edge); display: grid; place-items: center; }
  #viewBtn svg { width: 36px; height: 36px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linejoin: round; }

  #tip { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 100px); transform: translate(-50%, 20px);
    background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 16px; font-weight: 700; font-size: 16px;
    max-width: min(88vw, 420px); text-align: center; opacity: 0; transition: .4s; pointer-events: none; }
  #tip.show { opacity: .92; transform: translate(-50%, 0); }

  #shout { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); font-size: clamp(34px, 11vw, 64px); font-weight: 900;
    color: var(--accent); opacity: 0; pointer-events: none; white-space: nowrap;
    -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
  #shout.go { animation: shout 1.1s ease-out; }
  @keyframes shout { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4) rotate(-8deg) } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1) rotate(3deg) }
    35% { transform: translate(-50%, -50%) scale(1) rotate(0) } 75% { opacity: 1 } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1) } }

  .float { position: fixed; transform: translate(-50%, -50%); font-weight: 900; font-size: 20px; color: var(--ink); pointer-events: none;
    animation: floatUp .9s ease-out forwards; text-shadow: 0 0 6px var(--bg), 0 0 2px var(--bg); }
  .float.combo { color: var(--accent); font-size: 24px; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; }
  @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6) } 20% { opacity: 1; transform: translate(-50%, -60%) scale(1.15) }
    100% { opacity: 0; transform: translate(-50%, -260%) scale(1) } }

  .confetti { position: fixed; top: -20px; width: 9px; height: 14px; border-radius: 2px; pointer-events: none; z-index: 30;
    animation: fall linear forwards; }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); } }

  /* ---------- modals */
  .modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(30,20,15,.35); backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 20; padding: 20px; }
  .modal.show { opacity: 1; pointer-events: auto; }
  .card { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 28px; padding: 26px 22px 22px; width: min(92vw, 380px);
    text-align: center; transform: scale(.85) translateY(20px); transition: transform .4s cubic-bezier(.2,1.6,.4,1); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .modal.show .card { transform: none; }
  .card h2 { margin: 0 0 8px; font-size: 32px; font-weight: 900; letter-spacing: -.02em; }
  .card p { color: var(--muted); margin: 6px 0 16px; font-weight: 600; }
  #stars { display: flex; justify-content: center; gap: 8px; margin: 6px 0 14px; }
  #stars svg { width: 64px; height: 64px; fill: var(--heart-off); transition: fill .2s; }
  #stars svg:nth-child(2) { transform: translateY(-12px); width: 76px; height: 76px; }
  #stars svg.on { fill: var(--accent); animation: starPop .45s; }
  @keyframes starPop { 0% { transform: scale(.2) rotate(-40deg) } 60% { transform: scale(1.3) } }
  #stars svg.on:nth-child(2) { animation: starPop2 .45s; }
  @keyframes starPop2 { 0% { transform: translateY(-12px) scale(.2) } 60% { transform: translateY(-12px) scale(1.3) } 100% { transform: translateY(-12px) } }
  #winStats { display: flex; justify-content: space-around; margin: 4px 0 8px; }
  #winStats div { display: flex; flex-direction: column; }
  #winStats b { font-size: 22px; }
  #winStats span { font-size: 13px; color: var(--muted); font-weight: 700; }
  .btn { display: block; width: 100%; padding: 16px; border-radius: 18px; font-weight: 900; font-size: 20px; margin-top: 10px;
    background: var(--good); color: #fff; box-shadow: 0 5px 0 #2e9a5c; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #2e9a5c; }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: none; border: 2px solid var(--panel-edge); font-size: 17px; padding: 12px; }
  .btn.danger { background: transparent; color: var(--heart); box-shadow: none; font-size: 15px; padding: 10px; }
  .toggle { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; font-weight: 800; font-size: 18px; border-bottom: 1px solid var(--panel-edge); }
  .toggle input { width: 48px; height: 28px; appearance: none; background: var(--heart-off); border-radius: 14px; position: relative; transition: .2s; cursor: pointer; }
  .toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: .2s; }
  .toggle input:checked { background: var(--good); }
  .toggle input:checked::after { left: 23px; }
  .howto { text-align: left; color: var(--muted); font-weight: 600; font-size: 14px; line-height: 1.5; margin: 14px 0 4px; }
  .howto b { color: var(--ink); }

  @media (min-height: 800px) and (min-width: 600px) {
    #leftPill { top: calc(env(safe-area-inset-top) + 78px); }
  }
</style>
</head>
<body>
<div id="stage"></div>

<header id="top">
  <div id="level">Level 1</div>
  <div id="hearts">
    <svg viewBox="0 0 24 22"><path d="M12 21.5 10.3 20C4.2 14.5.5 11.1.5 6.9.5 3.5 3.1 1 6.4 1c1.9 0 3.9.9 5.6 2.9C13.7 1.9 15.7 1 17.6 1c3.3 0 5.9 2.5 5.9 5.9 0 4.2-3.7 7.6-9.8 13.1L12 21.5Z"/></svg>
    <svg viewBox="0 0 24 22"><path d="M12 21.5 10.3 20C4.2 14.5.5 11.1.5 6.9.5 3.5 3.1 1 6.4 1c1.9 0 3.9.9 5.6 2.9C13.7 1.9 15.7 1 17.6 1c3.3 0 5.9 2.5 5.9 5.9 0 4.2-3.7 7.6-9.8 13.1L12 21.5Z"/></svg>
    <svg viewBox="0 0 24 22"><path d="M12 21.5 10.3 20C4.2 14.5.5 11.1.5 6.9.5 3.5 3.1 1 6.4 1c1.9 0 3.9.9 5.6 2.9C13.7 1.9 15.7 1 17.6 1c3.3 0 5.9 2.5 5.9 5.9 0 4.2-3.7 7.6-9.8 13.1L12 21.5Z"/></svg>
  </div>
  <div class="icons">
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
    </button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </button>
  </div>
</header>

<div id="leftPill">
  <div class="row"><svg viewBox="0 0 24 24"><path d="M5 19 19 5M9 5h10v10"/></svg><span id="left">0</span></div>
  <div class="bar"><div id="progress"></div></div>
</div>

<div id="scorePill">
  <svg viewBox="0 0 24 24"><path d="M4 20 18 6M10 6h8v8" stroke="#3a2620" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 20 18 6M10 6h8v8" stroke="#e9c13b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span id="score">0</span>
</div>
<div id="comboBadge">x2</div>

<button id="hintBtn" aria-label="Hint">
  <svg viewBox="0 0 24 24"><circle class="glow" cx="12" cy="9.5" r="5.5"/><path d="M9 18h6M10 21h4M8.5 14.5A6.5 6.5 0 1 1 15.5 14.5c-.8.7-1.2 1.4-1.3 2.5H9.8c-.1-1.1-.5-1.8-1.3-2.5Z"/></svg>
  <span id="hintCount">3</span>
</button>

<button id="viewBtn" aria-label="Reset view">
  <svg viewBox="0 0 24 24"><path d="M12 2.5 21 7v10l-9 4.5L3 17V7l9-4.5Z"/><path d="M3 7l9 4.5L21 7M12 11.5v10M6 5.5l9 4.5M9 4l9 4.5M7.5 13.5v6M10 14.7v6M3 11.5l9 4.5M3 14.5l9 4.5"/></svg>
</button>

<div id="tip"></div>
<div id="shout"></div>

<div class="modal" id="win">
  <div class="card">
    <div id="stars">
      <svg viewBox="0 0 24 24"><path d="m12 1.8 3.1 6.4 7 1-5.1 4.9 1.2 7L12 17.8 5.8 21.1l1.2-7L1.9 9.2l7-1L12 1.8Z"/></svg>
      <svg viewBox="0 0 24 24"><path d="m12 1.8 3.1 6.4 7 1-5.1 4.9 1.2 7L12 17.8 5.8 21.1l1.2-7L1.9 9.2l7-1L12 1.8Z"/></svg>
      <svg viewBox="0 0 24 24"><path d="m12 1.8 3.1 6.4 7 1-5.1 4.9 1.2 7L12 17.8 5.8 21.1l1.2-7L1.9 9.2l7-1L12 1.8Z"/></svg>
    </div>
    <h2 id="winTitle">Perfect!</h2>
    <div id="winStats"></div>
    <p id="winReward"></p>
    <button class="btn" id="nextBtn">Next level ›</button>
    <button class="btn ghost" id="replayBtn">Replay</button>
  </div>
</div>

<div class="modal" id="lose">
  <div class="card">
    <h2>Out of hearts 💔</h2>
    <p id="loseText"></p>
    <button class="btn" id="retryBtn">Try again</button>
  </div>
</div>

<div class="modal" id="settings">
  <div class="card">
    <h2>Settings</h2>
    <label class="toggle">Sound <input type="checkbox" id="soundToggle"></label>
    <label class="toggle">Vibration <input type="checkbox" id="vibeToggle"></label>
    <div class="howto">
      <b>How to play:</b> tap an arrow to slide it off the cube in the direction it points.
      It can only leave if nothing is in its way until the edge of its face.
      Tapping a blocked arrow costs a ❤️. <b>Drag</b> to spin the cube, <b>pinch</b> to zoom.
    </div>
    <button class="btn" id="closeSettings">Resume</button>
    <button class="btn ghost" id="restartBtn">Restart level</button>
    <button class="btn danger" id="resetBtn">Reset progress</button>
  </div>
</div>

<script type="module" src="dist/game.js"></script>
</body>
</html>
